<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Video Page</title>
</head>
<body>
    <main>
        <div class="picture">
    <!--background picture/ Video-->
    <img src="seinfeld-jerry-stiller.avif" alt="background-picture">;
            </div>
                <div class="buttons">
    <!--Back, play/pause, previous, next, subtitles and menu buttons-->
    <button class="" type="back"><img src="back.png" alt="back-button"></button>;
    <button class="" type="play/pause"><img src="play-pause.png" alt="play-pause-button"></button>;
    <button class="" type="previous"><img src="prev.png" alt="previous-button"></button>
    <button class="" type="next"><img src="next.png" alt="next-button"></button>
    <button class="" type="subtitles"><img src="sub.png" alt="subtitles-button"></button>
    <button class="" type="menu"><img src="menu.png" alt="menu-button"></button>
                    </div>
                <div class="progress-bar">
    <!--progress bar-->
        <img src="progress.png" alt="progress-bar">
        </div>
</main>

</body>
</html>
